<!DOCTYPE html>
<html lang="fr-FR">
  <head>
    <meta charset="utf-8" />
    <title>Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>


  <body>
    <header>
        <h1>Calendar - Calendrier de l'avent</h1>
    </header>
    <main>
        <section id="ecran-attente">
            <h2>Patience…</h2>
            <p id="compte-a-rebours"> </p>
        </section>

        <ol id="grille"> </ol>

        <section id="ecran-noel" hidden>
            <h2>Joyeux Noël !</h2>
            <button id="bouton-non-ouverts">Voir mes cadeaux non ouverts</button>
        </section>

    </main>

    <dialog id="fenetre-cadeau">
        <h2 id="cadeau-titre">Jour x</h2>
        <div id="cadeau-media"> </div>
        <p id="cadeau-texte"> </p>
        <button id="cadeau-fermer">Fermer</button>
    </dialog>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

  </body>
</html>
