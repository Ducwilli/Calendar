<!DOCTYPE html>
<html lang="fr-FR">
  <head>
    <meta charset="utf-8" />
    <title>Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body>
    <header>
        <h1>Calendar - Calendrier de l'Avent</h1>
    </header>
    <main>
        <form>
            <label for="code">Code du calendrier : </label>
            <input autocapitalize="none" autocorrect="off" aria-live="polite" spellcheck="false" type="text" id="code" name="code" required />
            <button type="submit">Voir le calendrier</button>
            <p id="paragraphe-erreur"></p>
        </form>

        <a href="/creer">Créer mon calendrier</a>

    </main>

    <script src="/js/accueil.js" type="module"></script>

  </body>
</html>
